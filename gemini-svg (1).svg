<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="loopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="loopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="aiCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <radialGradient id="neuralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <filter id="vectorShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />

  <g filter="url(#vectorShadow)">
    
    <path d="M 330 220 L 250 300 L 330 380" fill="none" stroke="url(#bracketGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 670 220 L 750 300 L 670 380" fill="none" stroke="url(#bracketGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="430" cy="300" r="85" fill="url(#neuralGlow)" />
    <circle cx="570" cy="300" r="85" fill="url(#neuralGlow)" />

    <circle cx="430" cy="300" r="55" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4 6" />
    <ellipse cx="430" cy="300" rx="65" ry="30" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.4" transform="rotate(30, 430, 300)" />
    <ellipse cx="430" cy="300" rx="65" ry="30" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.4" transform="rotate(-30, 430, 300)" />

    <circle cx="570" cy="300" r="55" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4 6" />
    <ellipse cx="570" cy="300" rx="65" ry="30" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.4" transform="rotate(30, 570, 300)" />
    <ellipse cx="570" cy="300" rx="65" ry="30" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.4" transform="rotate(-30, 570, 300)" />

    <circle cx="380" cy="270" r="6" fill="#059669" />
    <circle cx="480" cy="330" r="6" fill="#059669" />
    <circle cx="520" cy="270" r="6" fill="#059669" />
    <circle cx="620" cy="330" r="6" fill="#059669" />
    
    <line x1="380" y1="270" x2="430" y2="300" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="480" y1="330" x2="430" y2="300" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="520" y1="270" x2="570" y2="300" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="620" y1="330" x2="570" y2="300" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.6"/>

    <path d="M 500 300 C 470 210, 350 210, 350 300 C 350 390, 470 390, 500 300 Z" 
          fill="none" stroke="url(#loopLeft)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 500 300 C 530 210, 650 210, 650 300 C 650 390, 530 390, 500 300 Z" 
          fill="none" stroke="url(#loopRight)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 460 260 C 485 280, 515 320, 540 340" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-opacity="0.3" />

    <circle cx="430" cy="300" r="28" fill="url(#aiCore)" stroke="#ffffff" stroke-width="6" />
    <circle cx="570" cy="300" r="28" fill="url(#aiCore)" stroke="#ffffff" stroke-width="6" />

    <circle cx="424" cy="294" r="8" fill="#ffffff" opacity="0.9" />
    <circle cx="564" cy="294" r="8" fill="#ffffff" opacity="0.9" />

  </g>
</svg>
